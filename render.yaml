services:
  - type: web
    name: pinn-multiphysics-explorer
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn dash_app.app:server --bind 0.0.0.0:$PORT --workers 1 --timeout 300
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
